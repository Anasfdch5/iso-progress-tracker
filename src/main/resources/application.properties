spring.application.name=iso-progress-tracker

# ------------------------------------------------------------------
# DATABASE CONFIGURATION (Persistent File-Based H2)
# ------------------------------------------------------------------
# Save data to a local file inside a 'data' folder in your project root
spring.datasource.url=jdbc:h2:file:./data/isotrackerdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ------------------------------------------------------------------
# H2 CONSOLE CONFIGURATION (Visual Browser Access)
# ------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ------------------------------------------------------------------
# Preserve existing tables and data on restart, update schema if entities change
spring.jpa.hibernate.ddl-auto=update

# Force Hibernate DDL creation before Spring Security / DataInitializer run
spring.jpa.defer-datasource-initialization=true

# Show formatted SQL queries in console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------
# MULTIPART / FILE UPLOAD CONFIGURATION
# ------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
