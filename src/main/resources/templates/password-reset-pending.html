<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Requested - ISO Progress Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 440px; text-align: center; }
        .icon { width: 56px; height: 56px; background-color: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px auto; }
        h1 { font-size: 20px; font-weight: 800; margin: 0 0 10px 0; }
        p { font-size: 13.5px; color: #9ca3af; line-height: 1.6; margin-bottom: 24px; }
        .btn { display: inline-block; width: 100%; padding: 12px; background-color: #6366f1; color: white; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 13.5px; box-sizing: border-box; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">⏳</div>
    <h1>Password Reset Request Sent</h1>
    <p>Your password reset request has been logged. An Administrator will review your account and update your password shortly.</p>
    <p>Once updated, you can verify your account details to sign in with your new credentials.</p>
    <a th:href="@{/check-reset-status}" class="btn">Check Reset Status</a>
</div>
</body>
</html>
