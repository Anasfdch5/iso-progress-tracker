<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password - Action Required</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 440px; }
        .icon { width: 56px; height: 56px; background-color: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px auto; }
        h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px 0; text-align: center; }
        p { font-size: 13px; color: #9ca3af; text-align: center; margin-bottom: 24px; line-height: 1.5; }
        .alert-danger { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: #9ca3af; font-size: 12px; text-transform: uppercase; }
        input[type="password"] { width: 100%; padding: 12px; border: 1px solid #1f2937; border-radius: 8px; background-color: #0b0f19; color: #fff; font-size: 13.5px; box-sizing: border-box; }
        input[type="password"]:focus { outline: none; border-color: #38bdf8; }
        .btn-submit { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; background-color: #6366f1; color: white; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">⚠️</div>
    <h1>Password Change Required</h1>
    <p>Your administrator reset your password. You must create a new personal password before accessing your dashboard.</p>

    <div th:if="${error}" class="alert-danger" th:text="${error}"></div>

    <form th:action="@{/force-change-password}" method="post">
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="Enter new password (min 6 chars)" minlength="6" required autofocus />
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" minlength="6" required />
        </div>

        <button type="submit" class="btn-submit">Set New Password & Continue</button>
    </form>
</div>

</body>
</html>
