<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ISO Progress Tracker - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --brand-indigo: #6366f1;
            --brand-cyan: #38bdf8;
            --brand-emerald: #10b981;
            --brand-rose: #ef4444;
            --brand-amber: #f59e0b;
            --shadow-card: 0 12px 32px 0 rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: var(--shadow-card);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-icon {
            width: 56px;
            height: 56px;
            background-color: rgba(99, 102, 241, 0.15);
            color: var(--brand-indigo);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 16px auto;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--brand-rose);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .alert-warning {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--brand-amber);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--brand-emerald);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-weight: 700;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .forgot-link {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: var(--brand-cyan);
            text-decoration: underline;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 13.5px;
            font-family: inherit;
            color: var(--text-primary);
            background-color: #0b0f19;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--brand-cyan);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            background-color: var(--brand-indigo);
            color: #ffffff;
            transition: opacity 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            font-size: 13px;
            color: var(--text-muted);
        }

        .auth-link {
            color: var(--brand-cyan);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <div class="auth-icon">🔐</div>
        <h1>ISO Progress Tracker</h1>
        <div class="subtitle">Sign in to access your dashboard</div>
    </div>

    <!-- Pending Admin Approval Alert -->
    <div th:if="${param.disabled}" class="alert alert-warning">
        ⏳ Admin has not accepted your login yet . Please check back shortly.
    </div>

    <!-- Error Alert -->
    <div th:if="${param.error}" class="alert alert-danger">
        ⚠️ Invalid username or password.
    </div>

    <!-- Logout Confirmation Alert -->
    <div th:if="${param.logout}" class="alert alert-success">
        ✓ You have been logged out.
    </div>

    <!-- Registration Success Flash Message -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}">
        ✓ Account created successfully!
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus />
        </div>

        <div class="form-group">
            <div class="label-row">
                <label for="password">Password</label>
                <a th:href="@{/forgot-password}" class="forgot-link">Forgot password?</a>
            </div>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a th:href="@{/register}" class="auth-link">Register here</a>
    </div>
</div>

</body>
</html>
