<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ISO Progress Tracker - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --brand-indigo: #6366f1;
            --brand-cyan: #38bdf8;
            --brand-rose: #ef4444;
            --shadow-card: 0 12px 32px 0 rgba(0, 0, 0, 0.45);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: var(--shadow-card);
        }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-icon {
            width: 56px; height: 56px;
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--brand-cyan);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; margin: 0 auto 16px auto;
        }
        h1 { margin: 0; font-size: 22px; font-weight: 800; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 18px; }
        .form-group.full-width { grid-column: span 2; }
        label { display: block; font-weight: 700; margin-bottom: 6px; color: var(--text-secondary); font-size: 13px; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 11px 14px;
            border: 1px solid var(--card-border);
            border-radius: 8px; font-size: 13.5px;
            color: var(--text-primary); background-color: #0b0f19;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: var(--brand-cyan); }
        .btn-submit {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-weight: 700; cursor: pointer; font-size: 14px;
            background-color: var(--brand-indigo); color: #ffffff;
            margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; }
        .alert {
            padding: 12px; border-radius: 8px; font-size: 13px;
            font-weight: 600; margin-bottom: 16px; text-align: center;
            background-color: rgba(239, 68, 68, 0.15); color: var(--brand-rose);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
        .auth-link { color: var(--brand-cyan); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <div class="auth-icon">📝</div>
        <h1>Create Account</h1>
        <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Fill in your details for admin approval</div>
    </div>

    <div th:if="${error}" class="alert" th:text="${error}">Error</div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="form-grid">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" th:field="*{firstName}" placeholder="First Name" required />
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" th:field="*{lastName}" placeholder="Last Name" required />
            </div>

            <div class="form-group full-width">
                <label for="email">Email Address</label>
                <input type="email" id="email" th:field="*{email}" placeholder="name@company.com" required />
            </div>

            <div class="form-group full-width">
                <label for="phoneNumber">Phone Number</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}" placeholder="+212 600 000 000" required />
            </div>

            <div class="form-group full-width">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" placeholder="Choose a username" required />
            </div>

            <div class="form-group full-width">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Choose a password" required />
            </div>
        </div>

        <button type="submit" class="btn-submit">Register Account</button>
    </form>

    <div class="auth-footer">
        Already have an account? <a th:href="@{/login}" class="auth-link">Sign in</a>
    </div>
</div>

</body>
</html>
