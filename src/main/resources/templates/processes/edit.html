<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ISO Progress Tracker - Edit Process</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg-dark: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;

            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;

            --brand-indigo: #6366f1;
            --brand-cyan: #38bdf8;
            --brand-amber: #f59e0b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .form-container {
            width: 100%;
            max-width: 550px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.45);
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--brand-amber);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 13.5px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 13.5px;
            font-family: inherit;
            color: var(--text-primary);
            background-color: #0b0f19;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
        }

        input[readonly] {
            background-color: rgba(31, 41, 55, 0.5);
            color: var(--text-muted);
            cursor: not-allowed;
            border-style: dashed;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--brand-cyan);
        }

        select option {
            background-color: #111827;
            color: var(--text-primary);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
        }

        .btn {
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-submit {
            background-color: var(--brand-indigo);
            color: #ffffff;
        }

        .btn-cancel {
            background-color: #1f2937;
            color: var(--text-secondary);
            border: 1px solid var(--card-border);
        }

        .btn-cancel:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header-title-group">
        <div class="header-icon">✏️</div>
        <div>
            <h1>Edit ISO Process</h1>
            <div style="font-size: 12.5px; color: var(--text-muted); margin-top: 2px;">Update process details and current workflow progress</div>
        </div>
    </div>

    <form th:action="@{/processes/update}" th:object="${process}" method="POST">
        <!-- Hidden field to retain entity ID for JPA update -->
        <input type="hidden" th:field="*{id}" />

        <!-- Process Name -->
        <div class="form-group">
            <label for="name">Process Name</label>
            <input type="text" id="name" th:field="*{name}" required />
        </div>

        <!-- ISO Standard Reference Dropdown -->
        <div class="form-group">
            <label for="standard">ISO Standard Reference</label>
            <select id="standard" th:field="*{standard}" required>
                <option value="" disabled>-- Select ISO Standard --</option>
                <option value="ISO 9001">ISO 9001 (Quality Management)</option>
                <option value="ISO 27001">ISO 27001 (Information Security)</option>
            </select>
        </div>

        <!-- Responsible Person Dropdown -->
        <div class="form-group">
            <label for="responsiblePerson">Responsible Person</label>
            <select id="responsiblePerson" th:field="*{responsiblePerson}" required>
                <option value="" disabled>-- Select Responsible Person --</option>
                <option th:each="user : ${users}"
                        th:value="${user.username}"
                        th:text="${user.username}">User Name</option>
            </select>
        </div>

        <!-- Fixed Target Date -->
        <div class="form-group">
            <label for="targetDate">Target Completion Date (Fixed)</label>
            <input type="date"
                   id="targetDate"
                   name="targetDate"
                   th:value="${process.targetDate != null ? #temporals.format(process.targetDate, 'yyyy-MM-dd') : ''}"
                   readonly
                   required />
        </div>

        <!-- Progress Percentage -->
        <div class="form-group">
            <label for="progress">Overall Progress (%)</label>
            <input type="number" id="progress" step="1" min="0" max="100" th:field="*{progress}" required />
        </div>

        <div class="btn-group">
            <a th:href="@{/processes}" class="btn btn-cancel">Cancel</a>
            <button type="submit" class="btn btn-submit">Save Changes</button>
        </div>
    </form>
</div>

</body>
</html>
